# 形状 fixture 清单（PLAN_APPLICABILITY.md 阶段 0.2 / 0.3）
#
# 生成方式：python fixtures/make_vaults.py   （确定性；产物在 fixtures/vaults/，已 gitignore）
# 消费方式：python fixtures/run_sweep.py [--browser]
#           逐库 build → verify →（可选）browser_check，按下面四个字段判红。
#
# 字段说明：
#   title       人话名字
#   shape       这个库长什么样（决定了它专考什么）
#   tests       它专门暴露哪一类失效（对应 PLAN_APPLICABILITY.md 的诊断编号）
#   config      相对 fixtures/ 的配置文件（自包含：vault / output / annotations 都相对它）
#   canary      真实的「人口」读数。sweep 必须校验它们，否则「没有东西可坏」会变成假绿。
#   expected_ok 该 fixture 上 verify / browser_check 的期望 [ok] 数。
#               **由 `python fixtures/run_sweep.py --update-manifest` 回填**；
#               ok 数与它不一致 = 用例被吞或被新增，sweep 直接判红。
#   known_gaps  预期会红的断言组 + 原因。纪律：红项必须能对上这里的一条，对不上就是回归。
#               修掉一个就把对应的行删掉。
#
# 2026-10-24 阶段 1.2 之后：原来的 [LADDER] / [INFLOW] 两簇红**已修掉**（阶梯按本库自己的
# 缩放区间夹 anchor、home 由区间反解、wheel_step 按目标格数反解）。现在只剩 tiny 的
# [ROOT-NOTE]（depth1 是笔记的模型假设），归阶段 1.4。**新增红项必须对得上 known_gaps。**

fixtures:
  tiny:
    title: 最小库
    shape: 1 篇笔记直接放在 vault 根、没有文件夹；标题 1 个（depth 2）
    tests: 退化规模 / 根笔记（depth1 是 note 而不是 folder）
    config: vaults/tiny/config.yaml
    canary: {folders: 0, notes: 1, headings: 1, semantic_edges: 0}
    expected_ok: {verify: 69, browser: 94}
    # 2026-10-24 阶段 1.4：根笔记模型已修（domain = 笔记自己的 id、depth1 允许是 note、
    # 越界判据改走父链取顶层祖先）—— verify 侧 **0 红**。
    # 2026-10-24 阶段 2：浏览器侧 4 类「用例前提不成立」已改成**显式跳过并计数**
    # （0 条语义边 → 7b/7c/7d；退化规模 → 采样阈值按落笔判；所有根 sr<28 → 地板标签；
    #  短笔记锚点 scrollTop=0 → 改按锚点相对面包屑的位置判）。现在 86 ok / 0 FAIL / 25 skip。
    known_gaps: []

  shallow:
    title: 浅库
    shape: 1 个文件夹 + 15 篇笔记、正文完全不用 #（max_depth=2）
    tests: 层级带 steps==0 / home_layer 夹取 / 最小规模冒烟
    config: vaults/shallow/config.yaml
    canary: {folders: 1, notes: 15, headings: 0, semantic_edges: 0}
    expected_ok: {verify: 69, browser: 79}
    known_gaps:

  ultra-deep:
    title: 极深链库
    shape: "**30 层**单链目录、每层 1 篇 + 1 个 h1（max_depth=32；半径沿链收缩到 1e-3 量级）"
    tests: "r 落盘钳位（阶段 3.2）/ 坐标精度自适应 / 深链几何断言（父内含子、兄弟不交、父大 1.5 倍）"
    config: vaults/ultra-deep/config.yaml
    canary: {folders: 30, notes: 30, headings: 30, semantic_edges: 0, max_depth: 32}
    expected_ok: {verify: 69, browser: 99}
    known_gaps: []

  deep-chain:
    title: 深链库
    shape: 10 层单链目录、每层 1 篇、每篇 1 个 h1（实测 depth 12）
    tests: 独子链 / 深度轴拉长 / 顶栏层级胶囊溢出（12 个 pill 在 1440px 下超额）
    config: vaults/deep-chain/config.yaml
    canary: {folders: 10, notes: 10, headings: 10, semantic_edges: 0}
    expected_ok: {verify: 69, browser: 98}
    known_gaps:
      - "[PILLS] 浏览器侧胶囊数 = max_depth，12 个在 1440px 下会挤压 / 裁切（template.html:86-91）—— 阶段 2.4"

  wide-roots:
    title: 宽扇出库
    shape: 30 个顶层目录共 150 篇；最大的占 60%（90/150），最小的只有 2 篇（≈1.3%）
    tests: 根数 ≠ 6 / 最小份额 / 学科色板只有 7 + 单一 fallback / 图例按实际 domain
    config: vaults/wide-roots/config.yaml
    canary: {folders: 30, notes: 150, headings: 150, semantic_edges: 0}
    expected_ok: {verify: 69, browser: 101}
    # 2026-10-24 阶段 2：浏览器侧的 5 类前提不成立已改成显式跳过并计数
    # （0 条语义边 → 7b/7c/7d；子树在 home 已全展开 / 深度余量不足两层 → 不再要求「露出更多」；
    #  短笔记锚点；图例「关系」一节在 0 链接时由 app.js 隐藏）。现在 92 ok / 0 FAIL / 22 skip。
    known_gaps:
      - "[LEGEND] 面板列 30 行，280px 宽 + 一列长滚动（template.html:153,157）—— 阶段 2.5"

  hub-dense:
    title: 稠密链接库
    shape: 80 篇 / 335 条语义边 / 一个入度 ≥12 的 hub / 5 条标题级链接 / 每篇 4 个标题
    tests: 边绘制预算（每帧逐条画）/ 焦点模式 / 端点标记 / chip 折叠 / 标题级链接
    config: vaults/hub-dense/config.yaml
    canary: {folders: 1, notes: 80, headings: 320, semantic_edges: 335}
    expected_ok: {verify: 69, browser: 136}
    known_gaps:

  edge-storm:
    title: 重量级链接库
    shape: 500 篇 / 每篇 12 条出链 → **6000 条语义边** / 2001 节点（阶段 2.2 的性能靶子）
    tests: 边批处理与可见面积预算（stride）/ 标记预算与焦点优先 / 深缩放裁剪 / 浏览器性能
    config: vaults/edge-storm/config.yaml
    canary: {folders: 1, notes: 500, headings: 1500, semantic_edges: 6000, max_depth: 4}
    expected_ok: {verify: 69, browser: 133}
    known_gaps: []

  long-notes:
    title: 超长笔记 + 小预览预算
    shape: 8 篇 × 约 3000 字符；config 把 `preview.total_chars_budget` 压到 12000 → 每篇上限 1500，**全部触发截断**（其中 1 篇的截断点落在围栏代码块内）
    tests: 预览预算截断（阶段 3.1）/ 围栏安全截断 / 锚点只覆盖保留部分 / verify 的预算断言
    config: vaults/long-notes/config.yaml
    canary: {folders: 1, notes: 8, headings: 24, semantic_edges: 0, max_depth: 4}
    expected_ok: {verify: 69, browser: 98}
    known_gaps: []

  heading-zoo:
    title: 标题动物园
    shape: 1 篇 h1..h6 链 / **1 篇只用 h5+h6（Offset.md）** / 3 篇笔记内重复「总结」/ 2 篇带图片 / 2 篇带公式
    tests: 标题层数稠密化（阶段 1.1）/ 锚点唯一性与错位 / KaTeX / 图片相对路径
    config: vaults/heading-zoo/config.yaml
    # max_depth=8 是稠密化后的读数：Offset.md 的 h5/h6 只占「笔记深度 +1 / +2」，
    # 不是 +5 / +6。若谁把 depth 改回标题级别字面值，verify 的 rank 断言会红。
    canary: {folders: 1, notes: 7, headings: 22, semantic_edges: 0, max_depth: 8}
    expected_ok: {verify: 69, browser: 100}
    known_gaps:

  plain:
    title: 纯文本库
    shape: 10 篇纯文本：0 标题 / 0 公式 / 0 图片 / 0 wiki 链接
    tests: 「内容特征被当成契约」—— verify 的公式断言、标题锚点覆盖率、browser 3e 的靶子
    config: vaults/plain/config.yaml
    canary: {folders: 1, notes: 10, headings: 0, semantic_edges: 0}
    expected_ok: {verify: 69, browser: 77}
    known_gaps:
      - "[BROWSER] 3c「放大到极端会空视口」在这个库上不成立：最深层就是笔记本身，前景层不参与 wash 的 maxzoom 退场，放大到 ZOOM_HARD 上限仍有 2 个圆覆盖视口 —— 显式跳过并计数（阶段 2.4）"

  remap-dup:
    title: 重映射 + 同名库
    shape: AA/BB 两个目录用 `as` 重映射成 Alpha/Beta；两边都有 Notes.md（同名 stem）；另有一个未列出的空目录
    tests: scope_file 工作流 / `as` 落地名 / 同名 stem 解析歧义 / 空目录不进图
    config: vaults/remap-dup/config.yaml
    canary: {folders: 2, notes: 4, headings: 4, semantic_edges: 0}
    expected_ok: {verify: 69, browser: 98}
    known_gaps:
