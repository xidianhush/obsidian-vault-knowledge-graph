# 手工标注层 —— 可选，但这是你给图谱「加语义」的地方。
#
# 改完跑 `python build.py build` 生效。
#
# 2026-10-24 起：不再有「掌握度 / 重要度」这类**节点**标注（它们只往界面上加噪声，
# 而且 annotations.yaml 一直是空的）。这里只保留两类东西：笔记别名 / 学科覆盖，以及
# 手工边。frontmatter 里的 weight / mastery 也会被忽略。

notes:
  # 键可以写笔记名（不带 .md），也可以写 vault 相对路径。
  # 支持的字段：aliases（别名，让 [[模电]] 这样的链接也能解析到这篇）、
  #             domain（覆盖自动推断的顶层学科）。
  # 示例（已注释，按需打开）：
  #
  # "模拟集成电路":
  #   aliases: ["模电"]
  #   domain: "Science and Tech"

edges:
  # 手工声明的有向边。source / target 同样接受笔记名或路径。
  # type: prerequisite（source 是 target 的前置）| derives（source 推导出 target）
  #       | contrast（并列/对比，无箭头）
  # status: accepted（默认）| rejected（写在这里但暂时不生效）
  #
  # 示例（已注释）：
  # - source: "MOSFET"
  #   target: "模拟集成电路"
  #   type: prerequisite
  #   weight: 3          # 边的强度（影响侧栏排序，不影响线宽）
  #   reason: "模电第一节课就是 MOSFET 的小信号模型"
