<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__</title>
<style>
  :root {
    --bg: #0f1116;
    --panel: #161a22;
    --panel-2: #1c212b;
    --line: #2a303c;
    --text: #d6dbe4;
    --muted: #7e879a;
    --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  #cy { position: absolute; inset: 0; }

  /* ── 顶栏 ─────────────────────────────────────────────────────── */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 46px;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: linear-gradient(180deg, rgba(15,17,22,.96), rgba(15,17,22,.75));
    border-bottom: 1px solid var(--line); z-index: 20;
  }
  #topbar .brand { font-weight: 600; letter-spacing: .3px; }
  #topbar .brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .spacer { flex: 1; }
  button, select, input {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 9px; font: inherit; outline: none;
  }
  button:hover, select:hover { border-color: #3d4657; cursor: pointer; }
  input:focus { border-color: var(--accent); }
  #search { width: 200px; }

  #levelbar { display: flex; align-items: center; gap: 6px; }
  #levelbar button { width: 26px; padding: 5px 0; text-align: center; }
  .pill {
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--muted); cursor: pointer; font-size: 12px;
  }
  .pill.on { color: #fff; border-color: var(--accent); background: #1d2c48; }
  #readout { color: var(--muted); font-size: 12px; min-width: 240px; }
  #readout b { color: var(--text); font-weight: 600; }

  /* ── 侧栏 ─────────────────────────────────────────────────────── */
  #sidebar {
    position: absolute; top: 46px; right: 0; bottom: 0; width: 360px;
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .22s ease;
    overflow-y: auto; padding: 16px; z-index: 15;
  }
  #sidebar.open { transform: none; }
  #sidebar h2 { margin: 0 0 4px; font-size: 16px; }
  #sidebar .path { color: var(--muted); font-size: 12px; word-break: break-all; margin-bottom: 12px; }
  #sidebar .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  }
  #sidebar .excerpt {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; color: #b6bdcb; font-size: 12px; margin-bottom: 12px;
    max-height: 150px; overflow-y: auto; white-space: pre-wrap;
  }
  #sidebar .actions { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  #sidebar h3 { font-size: 12px; color: var(--muted); text-transform: none;
    margin: 14px 0 6px; border-top: 1px solid var(--line); padding-top: 10px; }
  .elist { list-style: none; margin: 0; padding: 0; }
  .elist li {
    padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .elist li:hover { background: var(--panel-2); }
  .elist .arrow { color: var(--muted); font-family: monospace; }
  .elist .tag { font-size: 10px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  #sidebar .hlist { max-height: 260px; overflow-y: auto; }
  #sidebar .hlist li { font-size: 12px; }
  #sidebar .hdepth { color: var(--muted); font-family: monospace; font-size: 11px; }

  /* ── 图例与提示 ───────────────────────────────────────────────── */
  #legend {
    position: absolute; left: 12px; bottom: 12px; z-index: 10;
    background: rgba(22,26,34,.9); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; max-width: 280px;
  }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend .sw { width: 22px; height: 3px; border-radius: 2px; flex: none; }
  #legend .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  #legend .sq { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  #legend h4 { margin: 0 0 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
  #legend section + section { margin-top: 9px; }
  #legend .hint { color: var(--muted); font-size: 11px; margin-top: 8px; }

  #tooltip {
    position: absolute; pointer-events: none; z-index: 30; display: none;
    background: rgba(28,33,43,.97); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 10px; font-size: 12px; max-width: 320px;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  #tooltip b { font-size: 13px; }
  #tooltip .sub { color: var(--muted); font-size: 11px; margin-top: 3px; }

  #toast {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: rgba(28,33,43,.97); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font-size: 12px; opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 40;
  }
  #toast.show { opacity: 1; }
  #footer {
    position: absolute; right: 12px; bottom: 12px; color: var(--muted);
    font-size: 11px; z-index: 10; text-align: right; line-height: 1.5;
  }
  #hits {
    position: absolute; top: 54px; left: 12px; z-index: 18; width: 280px;
    background: rgba(22,26,34,.96); border: 1px solid var(--line); border-radius: 8px;
    max-height: 300px; overflow-y: auto; display: none;
  }
  #hits .hit { padding: 6px 10px; font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  #hits .hit:last-child { border-bottom: none; }
  #hits .hit:hover { background: var(--panel-2); }
  #hits .hit .why { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<div id="cy"></div>

<header id="topbar">
  <span class="brand">__PAGE_TITLE__<small id="subtitle"></small></span>
  <div id="levelbar">
    <button id="zoomout" title="缩小一层（[）">−</button>
    <span id="pills"></span>
    <button id="zoomin" title="放大一层（]）">+</button>
  </div>
  <span id="readout"></span>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="搜索笔记 / 标题…">
  <select id="domain"><option value="all">全部学科</option></select>
  <select id="mastery">
    <option value="all">全部掌握度</option>
    <option value="known">已掌握（≥3）</option>
    <option value="weak">待加强（1-2）</option>
    <option value="none">未标注</option>
  </select>
  <select id="labels" title="笔记标签的显示策略">
    <option value="auto">标签：自动</option>
    <option value="all">标签：全部显示</option>
    <option value="none">标签：只显示选中</option>
  </select>
  <button id="reset" title="回到该层默认视角">重置视角</button>
</header>

<div id="hits"></div>
<aside id="sidebar"></aside>

<div id="legend">
  <section>
    <h4>学科（顶层目录）</h4>
    <div id="legend-domains"></div>
  </section>
  <section>
    <h4>关系</h4>
    <div class="row"><span class="sw" style="background:#8B949E"></span>前置：source 是 target 的前置</div>
    <div class="row"><span class="sw" style="background:#4C8DFF"></span>引用：source 引用了 target</div>
    <div class="row"><span class="sw" style="background:#E3B341;height:0;border-top:2px dashed #E3B341"></span>并列/对比（方向未知）</div>
    <div class="row"><span class="sw" style="background:#30363D"></span>层级包含</div>
  </section>
  <section>
    <h4>节点</h4>
    <div class="row"><span class="sq" style="background:#2a303c;border:1.5px dashed #7e879a"></span>圆角方框 = 文件夹，「省界」轮廓</div>
    <div class="row"><span class="dot" style="background:#4C8DFF"></span>圆 = 笔记，颜色按学科</div>
    <div class="row"><span class="dot" style="background:#4C8DFF;box-shadow:0 0 0 2px #d6dbe4"></span>边框粗细 = 掌握度 1→5</div>
    <div class="row"><span class="dot" style="background:#6b7383;width:7px;height:7px"></span>小圆 = 笔记内的标题（知识点）</div>
  </section>
  <div class="hint">
    滚轮／<b>+</b> <b>−</b> 换层 · 单击节点看详情 · 单击笔记再点「展开知识点」看标题层 · <b>Esc</b> 收起
  </div>
</div>

<div id="tooltip"></div>
<div id="toast"></div>
<footer id="footer">
  生成于 __GENERATED__ · 数据来自 Obsidian vault（本地构建，无服务器）
</footer>

<script>/*__CYTOSCAPE__*/</script>
<script type="application/json" id="graph-data">/*__DATA__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
