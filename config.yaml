# 知识笔记语义缩放可视化系统 —— 构建与调参入口
#
# 想改「公开哪些文件夹和笔记」→ **不要改这里**，改 vault 里那份唯一真源：
#   D:/obsidian_vault/hush-ob-bucket/quartz-setup/public-scope.yaml
# 它同时决定：Quartz 站点镜像哪些目录、公开图谱扫哪些、私有图谱扫哪些。
# 本文件只管「怎么画」和「画几份、各输出到哪」。
#
# 日常命令：
#   python build.py build                 构建全部 scope（默认顺序里第一份是 private）
#   python build.py build --scope public  只构建公开那份
#   python build.py scope  --scope public 打印公开那份的镜像清单（JSON，给同步脚本读）

vault: D:/obsidian_vault/hush-ob-bucket
vault_name: hush-ob-bucket          # 供 obsidian:// 协议跳转使用
page_title: Hush 的知识图谱

# ── 范围真源 ────────────────────────────────────────────────────────────
# 就是 vault 里 quartz-setup/public-scope.yaml。文件缺失或写坏会直接报错退出，
# 不会静默退回某个默认范围 —— 范围这种东西猜错一次就是一次泄漏。
scope_file: D:/obsidian_vault/hush-ob-bucket/quartz-setup/public-scope.yaml

# ── 构建哪几份 ──────────────────────────────────────────────────────────
# 这里的键就是 --scope 的合法取值。顺序有意义：不指定 --scope 时构建第一个。
#   private  自留：6 个学科全量，只在本地，不上网。沿用旧文件名，
#            双击 dist/knowledge-graph.html 的习惯不用改。
#   public   与 Quartz 站点共用同一套公开范围；产物会被
#            vault 里的 quartz-setup/sync.ps1 复制进站点 content/ 并发布。
scopes:
  private:
    output:
      json: dist/graph.json
      html: dist/knowledge-graph.html
  public:
    output:
      json: dist/graph.public.json
      html: dist/knowledge-graph.public.html

# 这些扩展名的 [[链接]] 一律视为附件，不进图
attachment_ext: [png, jpg, jpeg, gif, svg, webp, bmp, heic, pdf, mp4, mov, zip, canvas, drawio, exe]

# ── 语义缩放 ────────────────────────────────────────────────────────────
# zoom 是唯一真源：可见性由每个节点的世界半径 r 连续决定（minzoom = lod.min_px / r），
# 换层从不反向改相机 —— 因此不存在「视角收窄→zoom 变大→又跳回深层」的正反馈震荡
# （那需要换层去改相机才会发生）。
#
# 方向：**滚轮向上（放大）= 看到更深的层级**，和地图一致。circle packing 下这条是
# 几何构造出来的：子圆严格落在父圆内部且半径更小 ⇒ minzoom 沿包含链严格递增，
# 不需要任何按深度的门控补丁。
#
# 这里没有任何绝对的 zoom 上下限：适配缩放 = 视口半径 / 世界半径，而视口半径是运行时
# 量，写死一个数必然在某些窗口尺寸下把最深的几层挡在可达范围外。真正的边界由渲染侧
# 从 r / enter / meta.layout_root_radius 现算，再由下面几个**无量纲**系数留出余量。
#
# ⚠ 这两个边界（zMin / zMax）是**地标，不是墙**（2026-10-14 起）：滚轮不再被它们夹住，
# 用户可以自由缩到比 zMin 更小、放到比 zMax 更大。它们仍然有明确职责，别删：
#   * HUD 的层级读数、层级胶囊、enterAt() 都用它们定位；
#   * focusOn / fitPair / zoomToDepth / homeZoom 仍然夹在它们之间 —— 那是「工具自己
#     带你去某个地方」，不该把你扔进空白。
# 放开之后的两种极端，都是**可达且可恢复**的：
#   * 缩过 zMin：圆的屏幕半径跌破 lod.min_px，画面逐渐清空（约 30 格滚轮后连世界半径
#     1000 的根都淡出）。render.js 有「此处没有内容」兜底提示，双击 / 重置按钮 / Home 键回来。
#   * 放过 zMax：只是圆继续变大、标签字号早在 lod.label_font_max 处饱和。再往深走会撞上
#     **本来就有**的 maxzoom 规则（圆铺满视口就停画，见 render.js 的 farCornerDist），
#     视口同样会空 —— 同一个兜底提示负责收场。
# 真正的护栏只剩 ZOOM_HARD（1e-6 … 1e6，写在 render.js），只防「任何 bug 把 zoom 推到
# 0/Infinity 让画布静默失效」，不是可用范围。
zoom:
  parent_dim: 0.22         # 子节点全部浮现后，父圆压暗到这个不透明度（保留上下文）。
                           # 嵌套实心圆下父圆是子圆的「底色」，0.5 会把子圆整体压暗，
                           # 0.22 才留得住「省 = 浅色面、市 = 清晰界线」的地图层次
  wheel_step: 1.12         # 滚轮一格的缩放倍率（以光标为锚点；向下滚则除以它）。
                           # 10 层要走完约 45 格；调大则层级切换更粗
  transition_ms: 260       # 点层级胶囊 / 搜索结果跳转时的相机动画时长
  zoom_in_ceiling: 1.35    # zMax 地标 = 最挤节点完全浮现所需的 zoom × 此值。
                           # 不再是滚轮上限（见上面那段），但决定层级胶囊与 focusOn 的上界
  zoom_out_floor: 1.05     # zMin 地标 = 最小学科根完全浮现所需的 zoom × 此值。
                           # **仍应 ≥ 1**：zMin 由最小那个学科根（Medical and Health，
                           # 8 个叶子）决定，取 0.9 会让它在这一档只剩 16.2px < min_px，
                           # 「缩到这一档能看见全部 6 个学科」这个地标含义就没了。1.05 留
                           # 5% 余量，抵消落盘时 r 只保留 4 位小数的舍入。
                           # kg/config.py 仍在守这条（守的是地标值合不合理，不是滚轮）
  home_fit: 1.08           # 初始视图 = 刚好装下全图的 zoom × 此值。
                           # **上限是 layout.padding = 1.12**：再大就会把 Science and Tech
                           # 裁出屏幕。1.08 时六个学科全部完整落在视口内，
                           # 最小根 20.4px，最大根包围盒 411.7px（视口半高 427px）
  home_level: 2            # 「初始视图停在第几层」——层级带阶梯的锚点。
                           # 2026-10-21 起 LOD 改成按深度的层级带（同层同时浮现、
                           # 同色），阶梯以 home 锚定：M[home_level] 由 home_zoom 与
                           # home_band 反解，上下按等比 rung 铺到 zMax。填 2 时：缩到
                           # 最外层只有 6 个学科根；滚一格开始展开第 2 层；home 落在
                           # 第 2 层的淡入带上。填 1 = 回到「home 就是第 1 层」的旧观感
                           # （但同层同色与父圆压暗时机仍是新算法）。见 HANDOFF §4 坑 39
  home_band: 0.5           # home 落在第 home_level 层淡入带的哪个位置：
                           # 0 = 刚开始浮现（看起来还是上一层），1 = 完全成熟。
                           # **别填 1**：层内半径差能到 40 倍，整层满不透明时最大的
                           # 那几个圆会把父圆结构完全盖住（2026-10-21 实测：home 变成
                           # 几块饱和蓝板）。0.5 时该层半透明，父圆还透得出来。

# ── 权重 ────────────────────────────────────────────────────────────────
weight:
  wiki_link: 1.0          # 正文 [[笔记]] 一次的基础权重
  heading_link_bonus: 0.5 # [[笔记#标题]] 额外加成
  embed_factor: 0.6       # ![[笔记]] 嵌入的折算系数
  annotation_default: 3.0 # annotations.yaml 里声明的边

# 优先级：annotation > frontmatter > wiki（靠前的先决定 weight / mastery）
precedence: [annotation, frontmatter, wiki]

# ── 候选边挖掘 ──────────────────────────────────────────────────────────
candidates:
  enabled: true
  min_score: 0.45
  min_term_len: 4            # 术语最短长度（ASCII）
  max_doc_freq_ratio: 0.25   # 出现频率高于此比例的术语视为通用词，丢弃
  min_shared_terms: 2        # 两篇笔记至少共享几个术语才成为候选
  max_suggestions: 400       # 单次产出的候选上限
  generic_headings: [总结, 定义, 性质, 示例, 示例代码, 代码解释, 方法, 作用, 特点,
                     例子, 应用, 原理, 例题, 练习, 习题, 理论, 问题, 注意, 注意事项,
                     其它, 其他, 参考, 参考资料, 概念, 输出结果, 思路, 感悟, 做题总结感悟]

# ── 布局 ────────────────────────────────────────────────────────────────
# Circle packing：深度 = 嵌套层数，规模 = 圆半径（见 kg/layout.py）。
# 子圆严格落在父圆内部，父圆半径至少是最大子圆的 level_ratio 倍。
# 坐标与半径一次算定，缩放只改相机 —— 这是「节点不跳动」的保证。
#
# 半径的两条规则：目标半径 ∝ 叶子数 ^ size_exponent（同级里内容多的更大），
# 再自顶向下按 min(装得下, 父子看得出差别) 等比缩放（层级越高越大）。
layout:
  size_exponent: 0.5   # 目标半径 ∝ 叶子数 ^ 此值。**0.5 是无标度不动点**：
                       # √(ΣTᵢ²) = √(ΣLᵢ) = T_parent 精确成立，每层缩放退化成
                       # 与分支数无关的常数 ≈0.85。调大→深层膨胀、根 spread 上升
                       # （0.6 时 16.2x → 28.3x，最小学科在 home 只剩 18.2px 没余量）
  level_ratio: 1.5     # 父圆半径 ≥ 最大子圆 × 此值。独子链打包出的包围圆就等于子圆
                       # 自己，光靠 padding 只有 1.12x，肉眼分不出父子；1.5 才看得出
  padding: 1.12        # 父圆半径 ≥ 子圆包围圆 × 此值（留出可见的环形边距）。
                       # 它同时是 zoom.home_fit 的硬上限
  norm_root_radius: 1000.0  # 虚拟根归一化后的半径（世界单位）。钉住坐标量级，
                       # 使 JSON 体积可控、zMin/zMax 不随 vault 增长而漂移
  leaf_radius: 1.0     # 退化子树与孤点的兜底半径（正常叶子的半径由缩放链决定）
  start_angle: -90     # 打包完整体旋转的角度（同输入必得同输出，同步任务的硬要求）

# ── LOD（按缩放裁剪细节）────────────────────────────────────────────────
# 3400+ 个节点不可能同时看清，所以不按「第几层」而按「这个圆在当前缩放下够不够大」
# 来决定画不画 —— 和地图软件给每个 feature 标 minzoom 是一回事。
# 布局侧已为每个节点算好世界半径 r，渲染侧只需 minzoom = min_px / r：
#   * r 沿包含链严格递减 ⇒ minzoom 严格递增 ⇒「放大 = 更深」自动成立，
#     不需要任何按深度封顶的补丁；
#   * 浮现的圆两两不相交且屏幕半径 ≥ min_px ⇒ 同屏圆数 ≤ (视口半径/min_px)²，
#     是个常数上界（实测峰值 134 个），不再有「939 个节点挤成 2.7px 间距」；
#   * 叶子半径随路径累积缩放而分散，浮现被摊开到十几格滚轮上
#     （单格最大涌入 18%，同心环时代是 66% 齐刷刷弹出）。
lod:
  min_px: 18             # 一个圆值得被画出来所需的最小屏幕**半径**（像素）。
                         # 它同时决定 zMin：最小学科根在 zMin 处恰好是
                         # min_px × zoom_out_floor，调小它会让缩放跨度整体拉长
  label_alpha: 0.02      # 节点淡入到多少不透明度才参与标签竞争。
                         # 2026-10-21 起标签与圆**同进同出**（用户要求）：门槛降到 0.02，
                         # 落笔浓度直接取圆这一帧的 alpha，圆淡到多少字就淡到多少。
                         # 仍然必须读「未被压暗」的层级带进度当门槛 —— 祖先层被
                         # parent_dim 压到底图浓度后永远够不到，会让最粗视图一个标签都没有。
                         # 标签另受 24px 碰撞网格与每帧 400 条预算限制
  label_font_min: 11     # 标签字号下限（px）
  label_font_max: 64     # 标签字号上限（px）。**别按旧的 22 改回去**：2026-10-21 实测
                         # 一个直径 3135px 的圆里那行 22px 的字只占直径 4%，整屏看上去
                         # 就是一片纯色（用户报的「满屏大片实心圆」）
  label_font_scale: 0.3  # 字号 = label_font_scale × 屏幕半径，再与「塞得进这个圆的最大字号」
                         # 取小、夹在 [min, max] 之间（2026-10-21 起，方案「丙」）：
                         #   ≈ 半径 40 → 12px、100 → 30px、200 → 60px、≥213 → 上限 64px
                         # 正比项让大圆里的字跟着长大填满圆；「塞得下」保证长标题不溢出。
                         # 调大 → 字更抢眼但长标题更容易被截断；调小 → 退回旧观感
  label_bold_depth: 2    # depth ≤ 此值的标签用 600 半粗。粗细是「类别」信号、字号是「尺度」
                         # 信号，两者不冲突
  fade_span: 1.35        # 淡入的缩放带宽（倍率）：zoom 从 minzoom/fade_span 升到 minzoom，
                         # alpha 从 0 走到 1。滚轮每格 1.12，约 2.6 格淡完，不会突兀
  focus_edge_dim: 0.07   # 选中一个元素后，与它无关的连线压到这个不透明度（0 = 彻底不画）。
                         # 留一点残影是为了保住「这片区域连得多密」的环境感知 —— 和
                         # Obsidian graph view 一致，也和 weak_edge_min_count 的 45%
                         # 基线连贯，不至于从 0.45 直接跳到 0
  hover_edge_dim: 0.75   # 只是悬停（没选中）时无关连线的压暗系数。悬停不做强过滤：
                         # evalHover 每帧重算，相机 tween 期间 hover 目标逐帧变化，
                         # 强过滤会让整屏连线频闪
  idle_edge_dim: 0.45    # **静息态**（既没选中、也没悬停）所有连线的浓度。2026-10-21 新增：
                         # 原先这个状态复用了 hover_edge_dim(0.75)，于是「刚打开界面」和
                         # 「鼠标停在空白处」都是 0.75 的白线满屏 —— 首屏显得很吵（网线感）。
                         # 现在只有**选中**浅层大元素时才靠 1.0 vs 0.07 的对比呈现网线感。
                         # 调大 → 回到旧观感；调小 → 首屏更淡（0.3 以下会开始看不清连接关系）
  edge_trim_clearance: 2 # 连线两端在圆的屏幕边界处截断，端点离圆边缘留这么多 px。
                         # 连线原本是圆心到圆心画的：两端都插进圆里，又和圆同色，于是
                         # 「这条线从哪个圆出发、到哪个圆结束」根本读不出来
  edge_marker_tint: 0.55 # 端点标记向浅色 #d6dbe4 提亮的混合比（0 = 与连线同色，1 = 纯浅灰）。
                         # 必须提亮：derives 的边色 #4C8DFF 和 Science and Tech 的节点色是
                         # 同一个 hex，同色标记落在同色圆边上等于隐形
  focus_offscreen_chips: 8 # 选中元素后，焦点链接屏外一端的「目标名 chip」最多同时挂几枚。
                         # 深缩放下一端常常屏外：视口边缘挂一枚 chip 写明目标是谁；超出的
                         # 折叠成右下角一枚「+k」。0 = 不挂 chip。
                         # 线由主绘制循环一路画到屏外，chip 挂在它穿出视口处；
                         # **两端都出屏**时也挂一枚（命名非焦点端、且要求这一帧真落了笔）。
  raw_edge_width: 1.0    # 每条链接线的固定屏幕线宽 px。
                         # 这一档刻意**不含任何 zoom 因子**：缩放只改线的长度，粗细、
                         # 颜色、透明度全部恒定 —— 用户要的就是「同一批线在任何尺度上都在，
                         # 且看起来是同一批线」。想让整束线更醒目就调大它，别去改 alpha
  raw_marker_min_len: 6  # 「线短到这个屏幕 px 就不画端点标记」的门槛。端点是**真实节点
                         # 自己**、不沿 parent 链上移，粗尺度下大量线只有几 px，门槛太大
                         # 会让它们全都没箭头，等于违背「细线箭头不随缩放消失」。
                         # 填 0 = 恒画标记

# ── 第 11 带 + Obsidian 式预览（2026-10-22 第三轮）────────────────────────
# 用户验收第二轮「正文直接铺在画布上」后的结论：只是「够用、能用」，排版不美观、
# 公式没渲染、图片没加载。第三轮换成 Obsidian 的做法：
#   1) 缩放比超过一条门槛（第 11 带「链接带」）后，在视口中心那个节点旁边画出它的
#      出站 [[链接]] **药丸**；
#   2) **按住 Ctrl 悬停药丸** → 光标旁浮现一个 HTML 浮层，里面是真渲染过的笔记：
#      markdown 排版、**KaTeX 公式**（vendored，构建期内联）、**图片**（按相对路径
#      引用 vault，file:// 下实测可加载）。
# 机制上「链接带」不是节点深度，**不进** lod.enter[]（那 10 项是与 max_depth 对齐的
# 数据契约）；它接在「h6 成熟」(M[10] = zMax) 之后、用同一条等比阶梯铺一条窗口：
#     淡入 [enter, mature] → 满 [mature, hold] → 淡出 [hold, exit]
# 越过 exit 就完全消失，并在画布中央提示「已越过链接带」；zMax 之外「放大到极端会空、
# 兜底提示照画」的契约（browser_check 3c）不变。
preview:
  enabled: true            # false = 完全回到「到第 10 带为止」的旧行为：
                           # payload 不存预览 HTML、lod 里没有 links、画布没有链接带
  max_note_chars: 0        # 0 = 预览整篇不截断（用户口径「整个目标笔记」）

# ── 配色 ────────────────────────────────────────────────────────────────
theme:
  domains:
    "Science and Tech":             "#4C8DFF"
    "Economy and Finance":          "#3FB950"
    "Medical and Health":           "#F85149"
    "Literature History Philosophy": "#C08BFF"
    "Interest":                     "#E3B341"
    "Projects":                     "#39C5BB"
    "Study log":                    "#F0883E"   # 公开 scope 的第三个根（vault 里的 Logs/Study log）
  fallback: "#8B949E"
  # 所有语义链接线（含端点标记的派生色）的统一颜色。2026-10-20 起不再按粒度分色：
  # 整篇级 [[笔记]] 与标题级 [[笔记#标题]] 同色。
  # 理由：文件夹/笔记/标题只是人为的**存储结构**，这张图要表达的是知识内在的
