# 知识笔记语义缩放可视化系统 —— 唯一维护入口
#
# 想改「公开哪些文件夹和笔记」→ 只改 include / exclude / exclude_notes，然后：
#   python build.py build
# 不需要碰任何 Python 代码。

vault: D:/obsidian_vault/hush-ob-bucket
vault_name: hush-ob-bucket          # 供 obsidian:// 协议跳转使用
page_title: Hush 的知识图谱

# ── 公开范围 ────────────────────────────────────────────────────────────
# 白名单：想公开哪个目录就加一行（按 vault 相对路径匹配，`**` 递归）
include:
  - "Science and Tech/**"
  - "Economy and Finance/**"
  - "Medical and Health/**"
  - "Literature History Philosophy/**"
  - "Interest/**"
  - "Projects/**"

# 黑名单：优先级高于 include
exclude:
  - "**/private/**"
  - "**/draft*"
  - "**/*.excalidraw.md"
  - "**/.trash/**"

# 逐篇笔记排除：写笔记名（不带 .md）即可，也可以用相对路径
exclude_notes: []
#  - "半导体物理(大二下)"     # 例：与另两篇半导体笔记内容重复

# 这些扩展名的 [[链接]] 一律视为附件，不进图
attachment_ext: [png, jpg, jpeg, gif, svg, webp, bmp, heic, pdf, mp4, mov, zip, canvas, drawio, exe]

# ── 语义缩放 ────────────────────────────────────────────────────────────
# zoom 是唯一真源：可见性由每个节点自带的 reveal（→ minzoom = lod.min_px / reveal）
# 连续决定，换层从不反向改相机 —— 因此不存在「视角收窄→zoom 变大→又跳回深层」
# 的正反馈震荡（那需要换层去改相机才会发生）。
#
# 方向：**滚轮向上（放大）= 看到更深的层级**，和地图一致。这条方向不是自动成立的，
# 见 kg/layout.py 里 _apply_depth_floor 的推导（同心圆布局把深度编码成半径、地图把
# 细节编码成尺度，两者不同构，必须叠一层按深度单调的门控才锁得住方向）。
#
# 这里没有任何绝对的 zoom 上下限：适配缩放 = 视口半径 / r_d，而视口半径是运行时量，
# 写死一个数必然在某些窗口尺寸下把最深的几层挡在可达范围外。真正的边界由渲染侧
# 从 reveal / enter 现算，再由下面两个**无量纲**系数留出余量。
zoom:
  parent_dim: 0.5          # 子节点全部浮现后，父节点压暗到这个不透明度（保留上下文）
  wheel_step: 1.12         # 滚轮一格的缩放倍率（以光标为锚点；向下滚则除以它）。
                           # 10 层要走完约 36 格 ≈ 每层 3.6 格；调大则层级切换更粗
  transition_ms: 260       # 点层级胶囊 / 搜索结果跳转时的相机动画时长
  zoom_in_ceiling: 1.35    # 最挤节点完全浮现所需的 zoom × 此值 = zoom 上限
  zoom_out_floor: 0.9      # 顶层学科完全浮现所需的 zoom × 此值 = zoom 下限。
                           # 1.0 会让顶层圆点在最外沿恰好 alpha=1、再滚没有反馈；
                           # 0.75 又淡到 alpha≈0.004 等于白屏。0.9 → alpha≈0.67，
                           # 是「再往外滚就淡出」的自然手感

# ── 权重 ────────────────────────────────────────────────────────────────
weight:
  wiki_link: 1.0          # 正文 [[笔记]] 一次的基础权重
  heading_link_bonus: 0.5 # [[笔记#标题]] 额外加成
  embed_factor: 0.6       # ![[笔记]] 嵌入的折算系数
  annotation_default: 3.0 # annotations.yaml 里声明的边

# 优先级：annotation > frontmatter > wiki（靠前的先决定 weight / mastery）
precedence: [annotation, frontmatter, wiki]

# ── 候选边挖掘 ──────────────────────────────────────────────────────────
candidates:
  enabled: true
  min_score: 0.45
  min_term_len: 4            # 术语最短长度（ASCII）
  max_doc_freq_ratio: 0.25   # 出现频率高于此比例的术语视为通用词，丢弃
  min_shared_terms: 2        # 两篇笔记至少共享几个术语才成为候选
  max_suggestions: 400       # 单次产出的候选上限
  generic_headings: [总结, 定义, 性质, 示例, 示例代码, 代码解释, 方法, 作用, 特点,
                     例子, 应用, 原理, 例题, 练习, 习题, 理论, 问题, 注意, 注意事项,
                     其它, 其他, 参考, 参考资料, 概念, 输出结果, 思路, 感悟, 做题总结感悟]

# ── 布局 ────────────────────────────────────────────────────────────────
# 层级径向布局：一个深度一圈（见 kg/layout.py）。角度按子树规模分配、决定同圈疏密；
# 半径等比放大、只决定圈间分离。坐标一次算定，缩放只改相机 —— 这是「节点不跳动」的保证。
layout:
  base_radius: 300     # 最内圈（depth=1）的半径，世界单位；只有相对值有意义
  ring_ratio: 1.7      # 半径逐圈放大的倍率。只影响圈间分离与总缩放跨度，
                       # 不影响同圈疏密（屏幕间距 = 视口半径 × Δθ，半径被约掉）
  angle_power: 0.5     # 角度权重的次线性指数：扇形角 ∝ 子树规模 ^ 此值。
                       # 1 = 线性（小文件夹被挤成极窄扇形），越小则大子树的后代越挤
  start_angle: -90     # 起算角度

# ── LOD（按缩放裁剪细节）────────────────────────────────────────────────
# 3400+ 个节点不可能同时看清，所以不按「第几层」而按「这个节点在当前缩放下
# 有没有地方站」来决定画不画 —— 和地图软件给每个 feature 标 minzoom 是一回事。
# 布局侧已为每个节点算好 reveal = 与同圈最近邻的世界弧长，并做了两道修正：
#   1) 沿包含链取前缀最小 —— 子节点不会比祖先先出现；
#   2) 按深度封顶（_apply_depth_floor）—— 保证「放大 = 更深」这个方向单调。
# 渲染侧 minzoom = min_px / reveal，于是「可见 ⇒ 屏幕上与最近邻至少分开 min_px」
# 是构造出来的保证；封顶只会抬高 minzoom，不会破坏它。
lod:
  min_px: 6              # 圆点之间允许的最小屏幕间距（像素）。调大 = 更稀疏、更早收拢
  label_alpha: 0.55      # 节点淡入到多少不透明度才参与标签竞争。门槛读的是**未被
                         # parent_dim 压暗的**淡入进度：压暗只是降低视觉重量，不该顺带
                         # 把标签藏掉，否则祖先层在任何 zoom 下都拿不到标签。
                         # 标签另受 24px 碰撞网格与每帧 400 条预算限制
  fade_span: 1.35        # 淡入的缩放带宽（倍率）：zoom 从 minzoom/fade_span 升到 minzoom，
                         # alpha 从 0 走到 1。滚轮每格 1.12，约 2.6 格淡完，不会突兀
  weak_edge_min_count: 2 # 聚合边 count 低于此值时压到 45% 不透明度（关系弱，别抢戏）

# ── 配色 ────────────────────────────────────────────────────────────────
theme:
  domains:
    "Science and Tech":             "#4C8DFF"
    "Economy and Finance":          "#3FB950"
    "Medical and Health":           "#F85149"
    "Literature History Philosophy": "#C08BFF"
    "Interest":                     "#E3B341"
    "Projects":                     "#39C5BB"
  fallback: "#8B949E"
  edges:
    prerequisite: "#8B949E"
    derives:      "#4C8DFF"
    contrast:     "#E3B341"
    contains:     "#30363D"

output:
  json: dist/graph.json
  html: dist/knowledge-graph.html
